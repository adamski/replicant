[package]
name = "replicant-seed"
version = "0.5.0"
edition = "2021"
description = "Seed a Replicant server with a directory of JSON documents"

[[bin]]
name = "replicant-seed"
path = "src/main.rs"

[dependencies]
replicant-client = { path = "../replicant-client" }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
uuid = { workspace = true }
walkdir = "2.5"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
