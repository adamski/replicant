name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run unit tests
      run: cargo test --workspace --lib
    
    - name: Run doc tests
      run: cargo test --workspace --doc

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: replicant_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.17'
        otp-version: '27'

    # The harness boots the stripped server (a library: no HTTP server of its
    # own) behind a minimal endpoint that mounts ReplicantServer.Sync.Socket on
    # :4000, seeds an enrolled user + credential (and one legacy nil-user
    # credential for the negative test), and runs the gated integration suite.
    # It clones the server itself at the pinned SERVER_REF, so no separate
    # checkout/credential/health steps are needed here.
    - name: Boot stripped server + run integration suite
      env:
        REPLICANT_SERVER_REF: '332a8ba'  # origin/main (PR #7 merged: claim -> user_id)
        REPLICANT_SERVER_DIR: /tmp/replicant-server-interop
        INTEROP_DB_HOST: localhost
        INTEROP_DB_USER: postgres
        INTEROP_DB_PASS: postgres
        INTEROP_DB_NAME: replicant_server_test
      run: ./test/run_phoenix_interop_local.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: cargo audit